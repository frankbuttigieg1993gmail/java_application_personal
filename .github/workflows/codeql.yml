name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  analyze:
    name: CodeQL Analyze (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended
          build-mode: manual

      - name: Build application
        run: |
          ./gradlew clean dependencies build -x test --no-daemon -info --scan --write-locks

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
          wait-for-processing: true

  codeql-pr-report:
    name: CodeQL PR Security Report
    runs-on: ubuntu-latest
    needs: analyze
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Read CodeQL alerts for this PR
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPOSITORY}/code-scanning/alerts?tool_name=CodeQL&pr=${PR_NUMBER}&state=open&per_page=100" \
            --slurp > codeql-pages.json

          jq '[.[][]]' codeql-pages.json > codeql-alerts.json

          CRITICAL=$(jq '[.[] | select(.rule.security_severity_level == "critical")] | length' codeql-alerts.json)
          HIGH=$(jq '[.[] | select(.rule.security_severity_level == "high")] | length' codeql-alerts.json)
          MEDIUM=$(jq '[.[] | select(.rule.security_severity_level == "medium")] | length' codeql-alerts.json)
          LOW=$(jq '[.[] | select(.rule.security_severity_level == "low")] | length' codeql-alerts.json)

          echo "critical=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "high=${HIGH}" >> "$GITHUB_OUTPUT"
          echo "medium=${MEDIUM}" >> "$GITHUB_OUTPUT"
          echo "low=${LOW}" >> "$GITHUB_OUTPUT"

          if (( CRITICAL > 0 || HIGH > 0 )); then
            echo "gate=failed" >> "$GITHUB_OUTPUT"
          elif (( MEDIUM > 0 )); then
            echo "gate=review" >> "$GITHUB_OUTPUT"
          else
            echo "gate=passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR comment
        env:
          CRITICAL: ${{ steps.report.outputs.critical }}
          HIGH: ${{ steps.report.outputs.high }}
          MEDIUM: ${{ steps.report.outputs.medium }}
          LOW: ${{ steps.report.outputs.low }}
          GATE: ${{ steps.report.outputs.gate }}
        shell: bash
        run: |
          set -euo pipefail

          case "$GATE" in
            failed)
              STATUS="BLOCKED"
              MESSAGE="Critical or High severity CodeQL findings must be resolved before merging."
              ;;
            review)
              STATUS="REVIEW"
              MESSAGE="No blocking Critical/High findings were found, but Medium findings should be reviewed."
              ;;
            *)
              STATUS="PASSED"
              MESSAGE="No blocking CodeQL security findings were found for this PR."
              ;;
          esac

          cat > codeql-comment.md <<COMMENT
          <!-- codeql-security-report -->

          ## CodeQL Security Report

          **Query suite:** \`security-extended\`

          | Severity | Findings | Policy |
          |---|---:|---|
          | Critical | ${CRITICAL} | **BLOCK** |
          | High | ${HIGH} | **BLOCK** |
          | Medium | ${MEDIUM} | Review |
          | Low | ${LOW} | Report |

          ### Security gate: ${STATUS}

          ${MESSAGE}

          Detailed findings, data-flow paths, and remediation information are available in the repository's Code Scanning results and the CodeQL pull-request check.

          _This comment is automatically updated on subsequent CodeQL runs._
          COMMENT

      - name: Create or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          EXISTING_COMMENT_ID="$(
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.body | contains("<!-- codeql-security-report -->")) | .id' \
              | head -n 1
          )"

          if [[ -n "${EXISTING_COMMENT_ID}" ]]; then
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${REPOSITORY}/issues/comments/${EXISTING_COMMENT_ID}" \
              --raw-field body="$(cat codeql-comment.md)"
          else
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --raw-field body="$(cat codeql-comment.md)"
          fi
